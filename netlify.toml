[build]
  command = "npm run build"
  publish = "dist"
[build.environment]
  NODE_VERSION = "22"
  # Launch build: no preview bar, robots.txt allows indexing. Who can open the
  # site is the owner's private/public switch in Admin (database/011).
  LAUNCH = "1"
  SITE_URL = "https://mowajeh.online/"
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
