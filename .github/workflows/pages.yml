# Builds the site and publishes it to GitHub Pages:
#   https://4wy2.github.io/muwajjah-app/
# One-time setting: repository Settings → Pages → Source: "GitHub Actions".
# (With "Deploy from a branch", Pages serves the unbuilt source → blank page.)
name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Custom domain: repository variable CUSTOM_DOMAIN (e.g. mowajeh.online).
      # Set it only after the domain's DNS points to GitHub Pages.
      - name: Site address
        run: |
          if [ -n "${{ vars.CUSTOM_DOMAIN }}" ]; then
            echo "BASE_PATH=/" >> $GITHUB_ENV
            echo "SITE_URL=https://${{ vars.CUSTOM_DOMAIN }}/" >> $GITHUB_ENV
          else
            echo "BASE_PATH=/${{ github.event.repository.name }}/" >> $GITHUB_ENV
            echo "SITE_URL=https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/" >> $GITHUB_ENV
          fi
      - run: npm run build
        env:
          # Launch switch: repository Settings → Variables → LAUNCH = 1
          # (no preview bar, robots.txt allows indexing). Who can open the site
          # is the owner's private/public switch in Admin, not this.
          LAUNCH: ${{ vars.LAUNCH }}
      - name: Custom domain file
        if: ${{ vars.CUSTOM_DOMAIN != '' }}
        run: echo "${{ vars.CUSTOM_DOMAIN }}" > dist/CNAME
      # GitHub Pages has no SPA rewrites: serve the app for unknown paths too,
      # so /muwajjah-app/universities/<id> works when opened directly.
      - run: cp dist/index.html dist/404.html && touch dist/.nojekyll
      # Keep the files of the build that is live right now: a page opened
      # before this update can still load the files it asks for.
      - name: Keep the live build's files
        continue-on-error: true
        run: |
          SITE="${SITE_URL%/}"
          curl -fsSL "$SITE/index.html" -o /tmp/live.html || exit 0
          grep -oh 'assets/[A-Za-z0-9._-]*' /tmp/live.html | sort -u > /tmp/live-assets.txt
          for f in $(cat /tmp/live-assets.txt); do
            [ -f "dist/$f" ] || curl -fsSL "$SITE/$f" -o "dist/$f" || true
          done
          # Chunks the live entry file loads later (pages, admin).
          for js in $(grep '\.js$' /tmp/live-assets.txt); do
            [ -f "dist/$js" ] && grep -oh '[A-Za-z0-9_-]*-[A-Za-z0-9_-]\{8\}\.\(js\|css\)' "dist/$js" | sort -u | while read c; do
              [ -f "dist/assets/$c" ] || curl -fsSL "$SITE/assets/$c" -o "dist/assets/$c" || true
            done
          done
          ls dist/assets | wc -l
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
